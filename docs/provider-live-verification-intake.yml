# Seven-provider live verification intake — research-only
# Never put API keys, token fragments, customer IDs, URLs with query parameters, or response bodies here.
# Fill only from reviewed vendor documentation and subscription entitlements.
# "pending" is intentional: no HTTP 200 response alone can authorize ingestion or forecasting.
schema_version: 1
release_gates:
  forecast: HOLD
  wager: NOT_APPROVED
  live_probe_requires:
    - documented_exact_readonly_endpoint
    - independently_reviewed_hostname_and_auth
    - protected_secret_environment
    - infrastructure_egress_allowlist
    - explicit_execution_approval
