name: Provider secret presence (manual, no network)
on:
  workflow_dispatch:
    inputs:
      confirm_presence_review:
        description: "Approve a presence-only check of configured provider secrets"
        required: true
        type: choice
        options:
          - "NO"
          - "I_APPROVE_PROVIDER_SECRET_PRESENCE_CHECK"
        default: "NO"

concurrency:
  group: ebt-provider-secret-presence
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  presence:
    if: >-
      ${{
        github.run_attempt == 1 &&
        github.ref_protected == true &&
        github.ref == 'refs/heads/main' &&
        inputs.confirm_presence_review == 'I_APPROVE_PROVIDER_SECRET_PRESENCE_CHECK'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Report presence only
        shell: bash
        env:
          RUNDOWN: ${{ secrets.EBT_THERUNDOWN_API_KEY }}
          SPORTSDATA: ${{ secrets.EBT_SPORTSDATA_API_KEY }}
          ODDS: ${{ secrets.EBT_THEODDS_API_KEY }}
          APISPORTS: ${{ secrets.EBT_APISPORTS_API_KEY }}
          RAPID: ${{ secrets.EBT_RAPIDAPI_API_KEY }}
          WEATHER: ${{ secrets.EBT_WEATHER_API_KEY }}
          SPORTRADAR: ${{ secrets.EBT_SPORTRADAR_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          keys = ("RUNDOWN", "SPORTSDATA", "ODDS", "APISPORTS", "RAPID", "WEATHER", "SPORTRADAR")
          for name in keys:
              print(f"{name}: {'PRESENT' if bool(os.environ.get(name)) else 'MISSING_OR_DIFFERENT_NAME'}")
          print("No endpoint requests made. Presence does not establish validity.")
          PY
