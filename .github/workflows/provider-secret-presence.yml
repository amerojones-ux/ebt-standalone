name: Provider secret presence (manual, no network)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RUNDOWN: ${{ secrets.THERUNDOWN_API_KEY }}
      SPORTSDATA: ${{ secrets.SPORTSDATA_API_KEY }}
      ODDS: ${{ secrets.THE_ODDS_API_KEY }}
      APISPORTS: ${{ secrets.API_SPORTS_API_KEY }}
      RAPID: ${{ secrets.RAPIDAPI_KEY }}
      WEATHER: ${{ secrets.WEATHERAPI_KEY }}
      SPORTRADAR: ${{ secrets.SPORTRADAR_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          keys = ("RUNDOWN", "SPORTSDATA", "ODDS", "APISPORTS", "RAPID", "WEATHER", "SPORTRADAR")
          for name in keys:
              print(f"{name}: {'PRESENT' if bool(os.environ.get(name)) else 'MISSING_OR_DIFFERENT_NAME'}")
          print("No endpoint requests made. Presence does not establish validity.")
          PY
