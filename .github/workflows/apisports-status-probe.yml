name: API-Sports zero-daily-quota one-shot status probe
on:
  workflow_dispatch:
    inputs:
      confirm_account_review:
        description: "Confirm /status privacy and rate-limit review"
        required: true
        type: choice
        options:
          - "NO"
          - "I_CONFIRM_APISPORTS_STATUS_PRIVACY_AND_RATE_LIMIT_REVIEWED"
        default: "NO"
      confirm_live_request:
        description: "Approve exactly ONE API-Sports /status request"
        required: true
        type: choice
        options:
          - "NO"
          - "I_APPROVE_ONE_APISPORTS_STATUS_REQUEST"
        default: "NO"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  one-shot-probe:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.confirm_account_review == 'I_CONFIRM_APISPORTS_STATUS_PRIVACY_AND_RATE_LIMIT_REVIEWED' &&
        inputs.confirm_live_request == 'I_APPROVE_ONE_APISPORTS_STATUS_REQUEST'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          check-latest: false

      - name: Validate pinned Python and GitHub CLI attestation capabilities
        id: toolchain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit("Python 3.13 required")
          PY

          gh --version
          gh attestation verify --help > /tmp/gh-attestation-verify-help.txt
          for flag in \
            --bundle \
            --repo \
            --signer-workflow \
            --source-ref \
            --source-digest \
            --format
          do
            grep -F -- "$flag" /tmp/gh-attestation-verify-help.txt >/dev/null
          done
          echo "toolchain_verified=1" >> "$GITHUB_OUTPUT"

      - name: Execute one sanitized API-Sports status request and verify receipt
        id: probe
        if: steps.toolchain.outputs.toolchain_verified == '1'
        env:
          EBT_APISPORTS_API_KEY: ${{ secrets.EBT_APISPORTS_API_KEY }}
        run: |
          set +e
          python3 apisports_status_probe.py \
            --account-review "I_CONFIRM_APISPORTS_STATUS_PRIVACY_AND_RATE_LIMIT_REVIEWED" \
            --confirm "I_APPROVE_ONE_APISPORTS_STATUS_REQUEST" \
            --receipt-path apisports_status_receipt.json
          probe_exit=$?

          receipt_ok=0
          if [ -f apisports_status_receipt.json ]; then
            python3 - <<'PY'
          import json
          from apisports_status_receipt import verify_receipt
          with open("apisports_status_receipt.json", encoding="utf-8") as handle:
              receipt=json.load(handle)
          raise SystemExit(0 if verify_receipt(receipt) else 1)
          PY
            verify_exit=$?
            if [ "$verify_exit" -eq 0 ]; then
              receipt_ok=1
              echo "### Sanitized API-Sports status receipt" >> "$GITHUB_STEP_SUMMARY"
              echo "_Integrity model: SHA-256 checksum only; not a cryptographic signature._" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat apisports_status_receipt.json >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### API-Sports receipt invalid" >> "$GITHUB_STEP_SUMMARY"
              echo "Receipt checksum/schema verification failed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### API-Sports receipt unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "Probe did not complete normal receipt serialization." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "receipt_verified=$receipt_ok" >> "$GITHUB_OUTPUT"
          if [ "$receipt_ok" -ne 1 ]; then
            exit 2
          fi
          exit "$probe_exit"

      - name: Attest sanitized receipt provenance
        id: attest
        if: always() && steps.probe.outputs.receipt_verified == '1'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: apisports_status_receipt.json

      - name: Verify signed receipt provenance
        id: verify_attestation
        if: >-
          ${{
            always() &&
            steps.probe.outputs.receipt_verified == '1' &&
            steps.attest.outcome == 'success'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          BUNDLE_EXPORT_FILE: apisports_attestation_bundle.json
          RECEIPT_FILE: apisports_status_receipt.json
          VERIFICATION_MARKER: apisports_attestation_verification.json
          PROVIDER_NAME: API-Sports
          SIGNER_WORKFLOW: .github/workflows/apisports-status-probe.yml
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_BUNDLE_PATH"
          test -f "$ATTESTATION_BUNDLE_PATH"

          gh attestation verify "$RECEIPT_FILE" \
            --bundle "$ATTESTATION_BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$SIGNER_WORKFLOW" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA" \
            --format json > /tmp/attestation-local-verification.json

          gh attestation verify "$RECEIPT_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$SIGNER_WORKFLOW" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA" \
            --format json > /tmp/attestation-api-verification.json

          cp -- "$ATTESTATION_BUNDLE_PATH" "$BUNDLE_EXPORT_FILE"
          test -s "$BUNDLE_EXPORT_FILE"

          python3 - <<'PY'
          import hashlib
          import json
          import os

          with open(os.environ["BUNDLE_EXPORT_FILE"], "rb") as handle:
              bundle_sha256 = hashlib.sha256(handle.read()).hexdigest()

          body = {
              "schema_version": 2,
              "provider": os.environ["PROVIDER_NAME"],
              "verification_status": "VERIFIED",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": os.environ["GITHUB_SHA"],
              "source_ref": "refs/heads/main",
              "signer_workflow": os.environ["SIGNER_WORKFLOW"],
              "attestation_id": os.environ.get("ATTESTATION_ID", ""),
              "attestation_url": os.environ.get("ATTESTATION_URL", ""),
              "attestation_bundle_sha256": bundle_sha256,
              "receipt_file": os.environ["RECEIPT_FILE"],
              "verification_tool": "gh attestation verify",
              "verification_modes": ["local_bundle", "github_api"],
          }
          canonical = json.dumps(
              body, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          marker = dict(body)
          marker["marker_sha256"] = hashlib.sha256(canonical).hexdigest()
          with open(
              os.environ["VERIFICATION_MARKER"], "w", encoding="utf-8"
          ) as handle:
              json.dump(marker, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          echo "attestation_verified=1" >> "$GITHUB_OUTPUT"

      - name: Persist exact verified attestation bundle
        if: always() && steps.verify_attestation.outputs.attestation_verified == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apisports-attestation-bundle-${{ github.run_id }}
          path: apisports_attestation_bundle.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Persist attestation verification marker
        if: always() && steps.verify_attestation.outputs.attestation_verified == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apisports-attestation-verification-${{ github.run_id }}
          path: apisports_attestation_verification.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Persist sanitized receipt artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apisports-status-receipt-${{ github.run_id }}
          path: apisports_status_receipt.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
