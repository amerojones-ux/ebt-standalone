name: API-Sports zero-daily-quota one-shot status probe
on:
  workflow_dispatch:
    inputs:
      confirm_account_review:
        description: "Confirm /status privacy and rate-limit review"
        required: true
        type: choice
        options:
          - "NO"
          - "I_CONFIRM_APISPORTS_STATUS_PRIVACY_AND_RATE_LIMIT_REVIEWED"
        default: "NO"
      confirm_live_request:
        description: "Approve exactly ONE API-Sports /status request"
        required: true
        type: choice
        options:
          - "NO"
          - "I_APPROVE_ONE_APISPORTS_STATUS_REQUEST"
        default: "NO"

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  one-shot-probe:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.confirm_account_review == 'I_CONFIRM_APISPORTS_STATUS_PRIVACY_AND_RATE_LIMIT_REVIEWED' &&
        inputs.confirm_live_request == 'I_APPROVE_ONE_APISPORTS_STATUS_REQUEST'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Execute one sanitized API-Sports status request and verify receipt
        id: probe
        env:
          EBT_APISPORTS_API_KEY: ${{ secrets.EBT_APISPORTS_API_KEY }}
        run: |
          set +e
          python3 apisports_status_probe.py \
            --account-review "I_CONFIRM_APISPORTS_STATUS_PRIVACY_AND_RATE_LIMIT_REVIEWED" \
            --confirm "I_APPROVE_ONE_APISPORTS_STATUS_REQUEST" \
            --receipt-path apisports_status_receipt.json
          probe_exit=$?

          receipt_ok=0
          if [ -f apisports_status_receipt.json ]; then
            python3 - <<'PY'
          import json
          from apisports_status_receipt import verify_receipt
          with open("apisports_status_receipt.json", encoding="utf-8") as handle:
              receipt=json.load(handle)
          raise SystemExit(0 if verify_receipt(receipt) else 1)
          PY
            verify_exit=$?
            if [ "$verify_exit" -eq 0 ]; then
              receipt_ok=1
              echo "### Sanitized API-Sports status receipt" >> "$GITHUB_STEP_SUMMARY"
              echo "_Integrity model: SHA-256 checksum only; not a cryptographic signature._" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat apisports_status_receipt.json >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### API-Sports receipt invalid" >> "$GITHUB_STEP_SUMMARY"
              echo "Receipt checksum/schema verification failed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### API-Sports receipt unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "Probe did not complete normal receipt serialization." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "receipt_verified=$receipt_ok" >> "$GITHUB_OUTPUT"
          if [ "$receipt_ok" -ne 1 ]; then
            exit 2
          fi
          exit "$probe_exit"

      - name: Attest sanitized receipt provenance
        if: always() && steps.probe.outputs.receipt_verified == '1'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: apisports_status_receipt.json

      - name: Persist sanitized receipt artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apisports-status-receipt-${{ github.run_id }}
          path: apisports_status_receipt.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
