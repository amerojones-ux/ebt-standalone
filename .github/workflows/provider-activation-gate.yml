name: Global provider activation gate (offline)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Validate global provider and model hold
        run: |
          python3 -m unittest discover -s tests -p test_provider_activation_gate.py -v
          python3 provider_activation_gate_cli.py config/provider_readiness.json
