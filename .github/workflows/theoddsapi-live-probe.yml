name: The Odds API zero-credit one-shot authentication probe
on:
  workflow_dispatch:
    inputs:
      confirm_account_review:
        description: "Confirm The Odds API account and zero-credit /sports endpoint were reviewed"
        required: true
        type: choice
        options:
          - "NO"
          - "I_CONFIRM_THEODDSAPI_ACCOUNT_AND_ZERO_CREDIT_ENDPOINT_REVIEWED"
        default: "NO"
      confirm_live_request:
        description: "Approve exactly ONE The Odds API /v4/sports request"
        required: true
        type: choice
        options:
          - "NO"
          - "I_APPROVE_ONE_THEODDSAPI_SPORTS_REQUEST"
        default: "NO"

permissions:
  contents: read

jobs:
  one-shot-probe:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.confirm_account_review == 'I_CONFIRM_THEODDSAPI_ACCOUNT_AND_ZERO_CREDIT_ENDPOINT_REVIEWED' &&
        inputs.confirm_live_request == 'I_APPROVE_ONE_THEODDSAPI_SPORTS_REQUEST'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Execute one sanitized zero-credit /sports request and verify receipt
        env:
          EBT_THEODDS_API_KEY: ${{ secrets.EBT_THEODDS_API_KEY }}
        run: |
          set +e
          python3 theoddsapi_live_probe.py \
            --account-review "I_CONFIRM_THEODDSAPI_ACCOUNT_AND_ZERO_CREDIT_ENDPOINT_REVIEWED" \
            --confirm "I_APPROVE_ONE_THEODDSAPI_SPORTS_REQUEST" \
            --receipt-path theoddsapi_probe_receipt.json
          probe_exit=$?

          receipt_ok=0
          if [ -f theoddsapi_probe_receipt.json ]; then
            python3 - <<'PY'
          import json
          from theoddsapi_probe_receipt import verify_receipt
          with open("theoddsapi_probe_receipt.json", encoding="utf-8") as handle:
              receipt = json.load(handle)
          raise SystemExit(0 if verify_receipt(receipt) else 1)
          PY
            receipt_verify=$?
            if [ "$receipt_verify" -eq 0 ]; then
              receipt_ok=1
              echo "### Sanitized The Odds API probe receipt" >> "$GITHUB_STEP_SUMMARY"
              echo "_Integrity model: SHA-256 checksum only; not a cryptographic signature._" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat theoddsapi_probe_receipt.json >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### The Odds API probe receipt invalid" >> "$GITHUB_STEP_SUMMARY"
              echo "Receipt checksum/schema verification failed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### The Odds API probe receipt unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "Probe did not complete normal receipt serialization." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$receipt_ok" -ne 1 ]; then
            exit 2
          fi
          exit "$probe_exit"

      - name: Persist sanitized receipt artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theoddsapi-probe-receipt-${{ github.run_id }}
          path: theoddsapi_probe_receipt.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
