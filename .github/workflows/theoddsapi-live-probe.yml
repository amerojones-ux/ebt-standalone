name: The Odds API zero-credit one-shot authentication probe
on:
  workflow_dispatch:
    inputs:
      confirm_account_review:
        description: "Confirm The Odds API account and zero-credit /sports endpoint were reviewed"
        required: true
        type: choice
        options:
          - "NO"
          - "I_CONFIRM_THEODDSAPI_ACCOUNT_AND_ZERO_CREDIT_ENDPOINT_REVIEWED"
        default: "NO"
      confirm_live_request:
        description: "Approve exactly ONE The Odds API /v4/sports request"
        required: true
        type: choice
        options:
          - "NO"
          - "I_APPROVE_ONE_THEODDSAPI_SPORTS_REQUEST"
        default: "NO"

concurrency:
  group: ebt-live-provider-probes
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  one-shot-probe:
    if: >-
      ${{
        github.run_attempt == 1 &&
        github.ref == 'refs/heads/main' &&
        inputs.confirm_account_review == 'I_CONFIRM_THEODDSAPI_ACCOUNT_AND_ZERO_CREDIT_ENDPOINT_REVIEWED' &&
        inputs.confirm_live_request == 'I_APPROVE_ONE_THEODDSAPI_SPORTS_REQUEST'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          check-latest: false

      - name: Validate pinned Python and GitHub CLI attestation capabilities
        id: toolchain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 13):
              raise SystemExit("Python 3.13 required")
          PY

          gh --version
          python_version="$(python3 -c 'import platform; print(platform.python_version())')"
          gh_version="$(gh --version | head -n 1 | awk '{print $3}')"
          test -n "$python_version"
          test -n "$gh_version"

          gh attestation verify --help > /tmp/gh-attestation-verify-help.txt
          for flag in \
            --bundle \
            --repo \
            --signer-workflow \
            --source-ref \
            --source-digest \
            --format
          do
            grep -F -- "$flag" /tmp/gh-attestation-verify-help.txt >/dev/null
          done
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
          echo "gh_version=$gh_version" >> "$GITHUB_OUTPUT"
          echo "toolchain_verified=1" >> "$GITHUB_OUTPUT"

      - name: Build sanitized one-shot execution intent
        id: intent
        if: steps.toolchain.outputs.toolchain_verified == '1'
        env:
          PROVIDER_NAME: The Odds API
          REVIEW_AUTHORIZATION: ${{ inputs.confirm_account_review }}
          REQUEST_AUTHORIZATION: ${{ inputs.confirm_live_request }}
          SIGNER_WORKFLOW: .github/workflows/theoddsapi-live-probe.yml
          ACTOR_NAME: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          python3 provider_execution_intent_cli.py \
            --provider "$PROVIDER_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --actor "$ACTOR_NAME" \
            --actor-id "$ACTOR_ID" \
            --review-authorization "$REVIEW_AUTHORIZATION" \
            --request-authorization "$REQUEST_AUTHORIZATION" \
            --output provider_execution_intent.json

          python3 - <<'PY'
          import json
          import os
          from provider_execution_intent import verify_execution_intent
          with open("provider_execution_intent.json", encoding="utf-8") as handle:
              intent=json.load(handle)
          if not verify_execution_intent(intent):
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as handle:
              handle.write("intent_sha256="+intent["intent_sha256"]+"\n")
          PY

          echo "intent_prepared=1" >> "$GITHUB_OUTPUT"

      - name: Attest one-shot execution intent
        id: attest_intent
        if: steps.intent.outputs.intent_prepared == '1'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: provider_execution_intent.json

      - name: Verify signed one-shot execution intent
        id: verify_intent
        if: >-
          ${{
            always() &&
            steps.intent.outputs.intent_prepared == '1' &&
            steps.attest_intent.outcome == 'success'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_ID: ${{ steps.attest_intent.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest_intent.outputs.attestation-url }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest_intent.outputs.bundle-path }}
          INTENT_BUNDLE_EXPORT_FILE: theoddsapi_execution_intent_attestation_bundle.json
          INTENT_MARKER_FILE: theoddsapi_execution_intent_attestation_verification.json
          PROVIDER_NAME: The Odds API
          SIGNER_WORKFLOW: .github/workflows/theoddsapi-live-probe.yml
          RUNNER_LABEL: ubuntu-24.04
          SETUP_PYTHON_SHA: 6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
          TOOLCHAIN_PYTHON_VERSION: ${{ steps.toolchain.outputs.python_version }}
          TOOLCHAIN_GH_VERSION: ${{ steps.toolchain.outputs.gh_version }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_BUNDLE_PATH"
          test -f "$ATTESTATION_BUNDLE_PATH"

          gh attestation verify provider_execution_intent.json \
            --bundle "$ATTESTATION_BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$SIGNER_WORKFLOW" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA" \
            --format json > /tmp/execution-intent-local-verification.json

          gh attestation verify provider_execution_intent.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$SIGNER_WORKFLOW" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA" \
            --format json > /tmp/execution-intent-api-verification.json

          cp -- "$ATTESTATION_BUNDLE_PATH" "$INTENT_BUNDLE_EXPORT_FILE"
          test -s "$INTENT_BUNDLE_EXPORT_FILE"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from provider_execution_intent import verify_execution_intent

          with open("provider_execution_intent.json","rb") as handle:
              intent_bytes=handle.read()
          with open("provider_execution_intent.json",encoding="utf-8") as handle:
              intent=json.load(handle)
          if not verify_execution_intent(intent):
              raise SystemExit("execution intent verification failed")
          with open(os.environ["INTENT_BUNDLE_EXPORT_FILE"],"rb") as handle:
              bundle_sha256=hashlib.sha256(handle.read()).hexdigest()

          body={
              "schema_version":1,
              "provider":os.environ["PROVIDER_NAME"],
              "verification_status":"VERIFIED",
              "repository":os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id":os.environ["GITHUB_RUN_ID"],
              "source_commit":os.environ["GITHUB_SHA"],
              "source_ref":"refs/heads/main",
              "signer_workflow":os.environ["SIGNER_WORKFLOW"],
              "actor":intent["actor"],
              "actor_id":intent["actor_id"],
              "intent_sha256":intent["intent_sha256"],
              "intent_file_sha256":hashlib.sha256(intent_bytes).hexdigest(),
              "request_plan_sha256":intent["request_plan_sha256"],
              "max_requests":intent["max_requests"],
              "attestation_id":os.environ.get("ATTESTATION_ID",""),
              "attestation_url":os.environ.get("ATTESTATION_URL",""),
              "attestation_bundle_sha256":bundle_sha256,
              "verification_tool":"gh attestation verify",
              "verification_modes":["local_bundle","github_api"],
              "runner_label":os.environ["RUNNER_LABEL"],
              "python_version":os.environ["TOOLCHAIN_PYTHON_VERSION"],
              "gh_version":os.environ["TOOLCHAIN_GH_VERSION"],
              "setup_python_sha":os.environ["SETUP_PYTHON_SHA"],
          }
          canonical=json.dumps(
              body,sort_keys=True,separators=(",",":")
          ).encode("utf-8")
          marker=dict(body)
          marker["marker_sha256"]=hashlib.sha256(canonical).hexdigest()
          with open(
              os.environ["INTENT_MARKER_FILE"],"w",encoding="utf-8"
          ) as handle:
              json.dump(marker,handle,indent=2,sort_keys=True)
              handle.write("\n")
          PY

          echo "intent_verified=1" >> "$GITHUB_OUTPUT"

      - name: Persist signed execution intent
        if: always() && steps.verify_intent.outputs.intent_verified == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theoddsapi-execution-intent-${{ github.run_id }}
          path: provider_execution_intent.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Persist execution intent attestation bundle
        if: always() && steps.verify_intent.outputs.intent_verified == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theoddsapi-execution-intent-attestation-bundle-${{ github.run_id }}
          path: theoddsapi_execution_intent_attestation_bundle.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Persist execution intent verification marker
        if: always() && steps.verify_intent.outputs.intent_verified == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theoddsapi-execution-intent-attestation-verification-${{ github.run_id }}
          path: theoddsapi_execution_intent_attestation_verification.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Execute one sanitized zero-credit /sports request and verify receipt
        id: probe
        if: >-
          ${{
            steps.toolchain.outputs.toolchain_verified == '1' &&
            steps.verify_intent.outputs.intent_verified == '1'
          }}
        env:
          EBT_THEODDS_API_KEY: ${{ secrets.EBT_THEODDS_API_KEY }}
        run: |
          set +e
          python3 theoddsapi_live_probe.py \
            --account-review "I_CONFIRM_THEODDSAPI_ACCOUNT_AND_ZERO_CREDIT_ENDPOINT_REVIEWED" \
            --confirm "I_APPROVE_ONE_THEODDSAPI_SPORTS_REQUEST" \
            --receipt-path theoddsapi_probe_receipt.json \
            --execution-intent-sha256 "${{ steps.intent.outputs.intent_sha256 }}"
          probe_exit=$?

          receipt_ok=0
          if [ -f theoddsapi_probe_receipt.json ]; then
            python3 - <<'PY'
          import json
          from theoddsapi_probe_receipt import verify_receipt
          with open("theoddsapi_probe_receipt.json", encoding="utf-8") as handle:
              receipt = json.load(handle)
          raise SystemExit(0 if verify_receipt(receipt) else 1)
          PY
            receipt_verify=$?
            if [ "$receipt_verify" -eq 0 ]; then
              receipt_ok=1
              echo "### Sanitized The Odds API probe receipt" >> "$GITHUB_STEP_SUMMARY"
              echo "_Integrity model: SHA-256 checksum only; not a cryptographic signature._" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat theoddsapi_probe_receipt.json >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### The Odds API probe receipt invalid" >> "$GITHUB_STEP_SUMMARY"
              echo "Receipt checksum/schema verification failed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### The Odds API probe receipt unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "Probe did not complete normal receipt serialization." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "receipt_verified=$receipt_ok" >> "$GITHUB_OUTPUT"
          if [ "$receipt_ok" -ne 1 ]; then
            exit 2
          fi
          exit "$probe_exit"

      - name: Attest sanitized receipt provenance
        id: attest
        if: always() && steps.probe.outputs.receipt_verified == '1'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: theoddsapi_probe_receipt.json

      - name: Verify signed receipt provenance
        id: verify_attestation
        if: >-
          ${{
            always() &&
            steps.probe.outputs.receipt_verified == '1' &&
            steps.attest.outcome == 'success'
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          BUNDLE_EXPORT_FILE: theoddsapi_attestation_bundle.json
          RECEIPT_FILE: theoddsapi_probe_receipt.json
          VERIFICATION_MARKER: theoddsapi_attestation_verification.json
          PROVIDER_NAME: The Odds API
          RUNNER_LABEL: ubuntu-24.04
          SETUP_PYTHON_SHA: 6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
          TOOLCHAIN_PYTHON_VERSION: ${{ steps.toolchain.outputs.python_version }}
          TOOLCHAIN_GH_VERSION: ${{ steps.toolchain.outputs.gh_version }}
          SIGNER_WORKFLOW: .github/workflows/theoddsapi-live-probe.yml
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_BUNDLE_PATH"
          test -f "$ATTESTATION_BUNDLE_PATH"

          gh attestation verify "$RECEIPT_FILE" \
            --bundle "$ATTESTATION_BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$SIGNER_WORKFLOW" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA" \
            --format json > /tmp/attestation-local-verification.json

          gh attestation verify "$RECEIPT_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$SIGNER_WORKFLOW" \
            --source-ref "refs/heads/main" \
            --source-digest "$GITHUB_SHA" \
            --format json > /tmp/attestation-api-verification.json

          cp -- "$ATTESTATION_BUNDLE_PATH" "$BUNDLE_EXPORT_FILE"
          test -s "$BUNDLE_EXPORT_FILE"

          python3 - <<'PY'
          import hashlib
          import json
          import os

          from provider_live_request_plan import request_plan_sha256

          with open(os.environ["BUNDLE_EXPORT_FILE"], "rb") as handle:
              bundle_sha256 = hashlib.sha256(handle.read()).hexdigest()

          body = {
              "schema_version": 4,
              "provider": os.environ["PROVIDER_NAME"],
              "verification_status": "VERIFIED",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": os.environ["GITHUB_SHA"],
              "source_ref": "refs/heads/main",
              "signer_workflow": os.environ["SIGNER_WORKFLOW"],
              "attestation_id": os.environ.get("ATTESTATION_ID", ""),
              "attestation_url": os.environ.get("ATTESTATION_URL", ""),
              "attestation_bundle_sha256": bundle_sha256,
              "receipt_file": os.environ["RECEIPT_FILE"],
              "verification_tool": "gh attestation verify",
              "verification_modes": ["local_bundle", "github_api"],
              "runner_label": os.environ["RUNNER_LABEL"],
              "python_version": os.environ["TOOLCHAIN_PYTHON_VERSION"],
              "gh_version": os.environ["TOOLCHAIN_GH_VERSION"],
              "setup_python_sha": os.environ["SETUP_PYTHON_SHA"],
              "request_plan_sha256": request_plan_sha256(
                  os.environ["PROVIDER_NAME"]
              ),
              "required_attestation_flags": [
                  "--bundle",
                  "--repo",
                  "--signer-workflow",
                  "--source-ref",
                  "--source-digest",
                  "--format",
              ],
          }
          canonical = json.dumps(
              body, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          marker = dict(body)
          marker["marker_sha256"] = hashlib.sha256(canonical).hexdigest()
          with open(
              os.environ["VERIFICATION_MARKER"], "w", encoding="utf-8"
          ) as handle:
              json.dump(marker, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          echo "attestation_verified=1" >> "$GITHUB_OUTPUT"

      - name: Persist exact verified attestation bundle
        if: always() && steps.verify_attestation.outputs.attestation_verified == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theoddsapi-attestation-bundle-${{ github.run_id }}
          path: theoddsapi_attestation_bundle.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Persist attestation verification marker
        if: always() && steps.verify_attestation.outputs.attestation_verified == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theoddsapi-attestation-verification-${{ github.run_id }}
          path: theoddsapi_attestation_verification.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Persist sanitized receipt artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theoddsapi-probe-receipt-${{ github.run_id }}
          path: theoddsapi_probe_receipt.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
