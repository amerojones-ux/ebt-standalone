name: Provider verification regression
on:
  push:
    branches:
      - development/provider-verification-gates-20261101
  pull_request:
    paths:
      - provider_verification.py
      - test_provider_verification.py
      - provider_contracts.py
      - test_provider_contracts.py
      - provider_capture_integrity.py
      - test_provider_capture_integrity.py
      - release_readiness.py
      - test_release_readiness.py
      - provider_intake.py
      - test_provider_intake.py
      - evidence_release_pipeline.py
      - test_evidence_release_pipeline.py
      - .github/workflows/provider-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline provider verification tests
        run: python -m unittest -v test_provider_verification test_provider_contracts test_provider_capture_integrity test_release_readiness test_provider_intake test_evidence_release_pipeline
