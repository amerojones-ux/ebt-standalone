name: EBT API secret presence verification (no network)
on:
  push:
    branches:
      - feature/secure-provider-gateway-v1
    paths:
      - '.github/workflows/api-secret-presence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-secret-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check seven API secret names (values never printed)
        shell: bash
        env:
          THERUNDOWN_PRESENT: ${{ secrets.EBT_THERUNDOWN_API_KEY != '' }}
          SPORTSDATA_PRESENT: ${{ secrets.EBT_SPORTSDATA_API_KEY != '' }}
          THEODDS_PRESENT: ${{ secrets.EBT_THEODDS_API_KEY != '' }}
          APISPORTS_PRESENT: ${{ secrets.EBT_APISPORTS_API_KEY != '' }}
          RAPIDAPI_PRESENT: ${{ secrets.EBT_RAPIDAPI_API_KEY != '' }}
          WEATHER_PRESENT: ${{ secrets.EBT_WEATHER_API_KEY != '' }}
          SPORTRADAR_PRESENT: ${{ secrets.EBT_SPORTRADAR_API_KEY != '' }}
        run: |
          set -euo pipefail
          missing=0
          for provider in THERUNDOWN SPORTSDATA THEODDS APISPORTS RAPIDAPI WEATHER SPORTRADAR; do
            variable="${provider}_PRESENT"
            if [[ "${!variable}" == "true" ]]; then
              echo "${provider}: CONFIGURED (presence only)"
            else
              echo "${provider}: MISSING"
              missing=1
            fi
          done
          echo "No API calls performed. Credential validity, coverage, rights and live feed status are UNVERIFIED."
          echo "FORECAST HOLD / WAGER NOT APPROVED"
          exit "$missing"
