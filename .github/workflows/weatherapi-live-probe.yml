name: WeatherAPI one-shot live authentication probe
on:
  workflow_dispatch:
    inputs:
      confirm_plan_quota_billing_review:
        description: "Confirm WeatherAPI plan, quota and billing were reviewed"
        required: true
        type: choice
        options:
          - "NO"
          - "I_CONFIRM_WEATHERAPI_PLAN_QUOTA_AND_BILLING_REVIEWED"
        default: "NO"
      confirm_live_request:
        description: "Approve exactly ONE WeatherAPI request"
        required: true
        type: choice
        options:
          - "NO"
          - "I_APPROVE_ONE_WEATHERAPI_REQUEST"
        default: "NO"

permissions:
  contents: read

jobs:
  one-shot-probe:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        inputs.confirm_plan_quota_billing_review == 'I_CONFIRM_WEATHERAPI_PLAN_QUOTA_AND_BILLING_REVIEWED' &&
        inputs.confirm_live_request == 'I_APPROVE_ONE_WEATHERAPI_REQUEST'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Execute one sanitized WeatherAPI request and verify receipt
        env:
          EBT_WEATHER_API_KEY: ${{ secrets.EBT_WEATHER_API_KEY }}
        run: |
          set +e
          python3 weatherapi_live_probe.py \
            --plan-review "I_CONFIRM_WEATHERAPI_PLAN_QUOTA_AND_BILLING_REVIEWED" \
            --confirm "I_APPROVE_ONE_WEATHERAPI_REQUEST" \
            --receipt-path weatherapi_probe_receipt.json
          probe_exit=$?

          receipt_ok=0
          if [ -f weatherapi_probe_receipt.json ]; then
            python3 - <<'PY'
          import json
          from weatherapi_probe_receipt import verify_receipt
          with open("weatherapi_probe_receipt.json", encoding="utf-8") as handle:
              receipt = json.load(handle)
          raise SystemExit(0 if verify_receipt(receipt) else 1)
          PY
            receipt_verify=$?
            if [ "$receipt_verify" -eq 0 ]; then
              receipt_ok=1
              echo "### Sanitized WeatherAPI probe receipt" >> "$GITHUB_STEP_SUMMARY"
              echo "_Integrity model: SHA-256 checksum only; not a cryptographic signature._" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat weatherapi_probe_receipt.json >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### WeatherAPI probe receipt invalid" >> "$GITHUB_STEP_SUMMARY"
              echo "Receipt checksum/schema verification failed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### WeatherAPI probe receipt unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "Probe did not complete normal receipt serialization." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$receipt_ok" -ne 1 ]; then
            exit 2
          fi
          exit "$probe_exit"
