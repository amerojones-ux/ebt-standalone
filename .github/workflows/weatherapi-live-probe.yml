name: WeatherAPI one-shot live authentication probe
on:
  workflow_dispatch:
    inputs:
      confirm_live_request:
        description: "Select exact approval phrase to permit ONE WeatherAPI request"
        required: true
        type: choice
        options:
          - "NO"
          - "I_APPROVE_ONE_WEATHERAPI_REQUEST"
        default: "NO"
permissions:
  contents: read
jobs:
  one-shot-probe:
    if: ${{ inputs.confirm_live_request == 'I_APPROVE_ONE_WEATHERAPI_REQUEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Execute one sanitized WeatherAPI request
        env:
          EBT_WEATHER_API_KEY: ${{ secrets.EBT_WEATHER_API_KEY }}
        run: |
          python3 weatherapi_live_probe.py --confirm "I_APPROVE_ONE_WEATHERAPI_REQUEST"
