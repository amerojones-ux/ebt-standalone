name: Live provider approval gate (offline only)
on:
  workflow_dispatch:

concurrency:
  group: ebt-live-provider-approval-gate
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  approval-gate:
    if: >-
      ${{
        github.run_attempt == 1 &&
        github.ref_protected == true &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Assert no provider approved and network disabled
        run: |
          python3 -m unittest discover -s tests -p test_live_provider_gate.py -v
          python3 live_provider_gate.py config/live_provider_approval.json
