name: EBT research provider gateway checks
on:
  push:
    branches:
      - feature/secure-provider-gateway-v1
  pull_request:
    paths:
      - 'extensions/provider_gateway.py'
      - 'extensions/provider_reconciliation.py'
      - 'extensions/provider_probe.py'
      - 'extensions/provider_policy.py'
      - 'extensions/weatherapi_status.py'
      - 'extensions/weather_evidence.py'
      - 'extensions/weatherapi_request_plan.py'
      - 'extensions/weather_release_gate.py'
      - 'extensions/weather_release_audit.py'
      - 'extensions/weather_verified_evidence.py'
      - 'extensions/weather_attestation_envelope.py'
      - 'extensions/weather_attestation_verify.py'
      - 'extensions/weather_replay_policy.py'
      - 'extensions/weather_production_readiness.py'
      - 'extensions/prop_market_normalizer.py'
      - 'tests/test_provider_gateway.py'
      - 'tests/test_provider_reconciliation.py'
      - 'tests/test_provider_probe.py'
      - 'tests/test_provider_policy.py'
      - 'tests/test_provider_weatherapi_status.py'
      - 'tests/test_provider_weather_evidence.py'
      - 'tests/test_provider_weatherapi_request_plan.py'
      - 'tests/test_provider_weather_release_gate.py'
      - 'tests/test_provider_weather_release_audit.py'
      - 'tests/test_provider_weather_verified_evidence.py'
      - 'tests/test_provider_weather_attestation_envelope.py'
      - 'tests/test_provider_weather_attestation_verify.py'
      - 'tests/test_provider_weather_replay_policy.py'
      - 'tests/test_provider_weather_production_readiness.py'
      - 'tests/test_provider_prop_market_normalizer.py'
      - 'tests/test_provider_platform_audit_gate.py'
      - 'tests/test_provider_preflight.py'
      - 'extensions/provider_preflight.py'
      - 'config/platform_audit_gate_2026_10_30.json'
      - 'config/module_readiness_2026_10_30.json'
      - '.github/workflows/provider-gateway-ci.yml'
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install signature verification dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Run offline tests (no API keys, no network provider calls)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p 'test_provider_*.py' -v
          python -m compileall -q extensions/provider_gateway.py extensions/provider_reconciliation.py extensions/provider_probe.py extensions/provider_policy.py extensions/weatherapi_status.py extensions/weather_evidence.py extensions/weatherapi_request_plan.py extensions/weather_release_gate.py extensions/weather_release_audit.py extensions/weather_verified_evidence.py extensions/weather_attestation_envelope.py extensions/weather_attestation_verify.py extensions/weather_replay_policy.py extensions/weather_production_readiness.py extensions/prop_market_normalizer.py extensions/provider_preflight.py
