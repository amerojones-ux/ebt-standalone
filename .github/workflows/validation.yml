name: Sports validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -v
      - name: Reconcile provider contracts
        run: python provider_contract_reconciliation_cli.py

      - name: Assert global provider/model SAFE_HOLD
        run: python provider_activation_gate_cli.py config/provider_readiness.json

      - name: Assert prepared live probes remain default-deny
        run: python provider_probe_readiness_registry_cli.py

      - name: Assert remaining provider probes stay fail-closed
        run: python remaining_provider_probe_preconditions_cli.py

      - name: Assert unresolved provider account evidence stays redacted and fail-closed
        run: python provider_account_evidence_cli.py

      - name: Assert provider account evidence matches operational configs
        run: python provider_account_evidence_consistency_cli.py

      - name: Assert remaining-provider operator state is valid and fail-closed
        run: python provider_remaining_operator_state_cli.py

      - name: Check command-line entry point
        run: python ebt_cli.py --help

      - name: Check research extension command-line entry points
        run: |
          python ebt_extensions_cli.py --help
          python ebt_prop_card_cli.py --help
          python ebt_opportunity_discovery_cli.py --help
          python opportunity_discovery_readiness_cli.py
          python nba_official_injury_cli.py --help
          python revalidation_orchestrator_cli.py --help
          python opportunity_reallocation_cli.py --help
          python bayesian_rare_events_cli.py --help
          python correlated_joint_mc_cli.py --help
