name: WeatherAPI execution authorization gate (offline)
on:
  workflow_dispatch:

concurrency:
  group: ebt-weatherapi-execution-gate
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  safe-hold:
    if: >-
      ${{
        github.run_attempt == 1 &&
        github.ref_protected == true &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate fail-closed plan
        run: |
          python3 -m unittest discover -s tests -p test_weatherapi_execution_gate.py -v
          python3 weatherapi_execution_gate.py config/weatherapi_execution_plan.json
